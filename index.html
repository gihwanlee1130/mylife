 h+='<label>운영시간</label><input id="f_h" value="'+esc(d.h||'')+'" placeholder="예: 09:00–18:00"><div class="g2"><div><label>휴무</label><input id="f_c" value="'+esc(d.c||'')+'"></div><div><label>요금</label><input id="f_f" value="'+esc(d.f||'')+'"></div></div>';
 h+='<label>주소</label><input id="f_a" value="'+esc(d.a||'')+'"><label>전화</label><input id="f_tel" inputmode="tel" value="'+esc(d.tel||'')+'">';
 h+='<label>지도 위치</label><div class="btnrow" style="margin-top:0"><button id="f_pick">'+(hasPos(d)?'위치 설정됨 · 다시 선택':'지도에서 위치 선택')+'</button>'+(hasPos(d)?'<button id="f_unpick">위치 지우기</button>':'')+'</div>';
 h+='</div><div class="btnrow"><button id="f_cancel">취소</button><button class="p" id="f_save">'+(isEdit?'저장':'추가')+'</button></div>';
 showSheet(h);$('shx').onclick=closeSheet;$('f_cancel').onclick=closeSheet;
 function read(){var o=Object.assign({},d);o.day=$('f_day').value;o.t=$('f_t').value.trim()||'시간 미정';o.n=$('f_n').value.trim();o.ic=$('f_ic').value;o.who=$('f_who').value;o.note=$('f_note').value.trim();o.h=$('f_h').value.trim();o.c=$('f_c').value.trim();o.f=$('f_f').value.trim();o.a=$('f_a').value.trim();o.tel=$('f_tel').value.trim();return o}
 if($('f_cat'))$('f_cat').onchange=function(){var c=cat.filter(function(x){return x.k===$('f_cat').value})[0];if(!c)return;var o=read();o.n=c.n;o.h=c.h;o.c=c.c;o.f=c.f;o.a=c.a;o.tel=c.tel;o.tips=c.tips;o.q=c.q;o.v=c.v;o.ic=c.ic;if(c.lng!=null){o.lng=c.lng;o.lat=c.lat}openForm(o)};
 $('f_pick').onclick=function(){startPick(read())};
 if($('f_unpick'))$('f_unpick').onclick=function(){var o=read();delete o.lng;delete o.lat;openForm(o)};
 $('f_save').onclick=function(){var o=read();if(!o.n){$('f_n').focus();return}
  if(!isEdit){var id='u'+Date.now().toString(36)+Math.floor(Math.random()*99),list=dayStops(o.day),tm=tmin(o.t),pos=list.length?list[list.length-1].ord+10:10;
   if(tm!=null){for(var i=0;i<list.length;i++){var lt=tmin(list[i].t);if(lt!=null&&lt>tm){pos=i?(list[i-1].ord+list[i].ord)/2:list[i].ord-5;break}}}
   o.ord=pos;if(o.v==null)o.v=1;if(o.np==null)o.np=0;if(o.go==null)o.go='';put('stops',id,clean(o));}
  else{var id2=o.id;put('stops',id2,clean(o))}
  closeSheet();if(o.day!==st.day&&st.day!=='all'){pickDay(o.day,false)}}}
// ---- budget
var bt={},dirty=false;
function drawBudget(){var rows=$('rows');if(rows.contains(document.activeElement)&&document.activeElement.tagName==='INPUT'){dirty=true;sumBudget();return}
 rows.innerHTML='';items('budget').forEach(function(b){var r=el('div','row','<div class="ic" style="--c:var(--acc)">'+ico(b.ic||'won')+'</div><div>'+esc(b.n)+(b.note?'<small>'+esc(b.note)+'</small>':'')+'</div><input inputmode="numeric" placeholder="예상 금액" aria-label="예상" data-f="est"><input inputmode="numeric" placeholder="집행 금액" aria-label="집행" data-f="act">');
  var ins=r.querySelectorAll('input');ins[0].value=b.est?fmt(b.est):'';ins[1].value=b.act?fmt(b.act):'';
  Array.prototype.forEach.call(ins,function(inp){inp.disabled=!canW;inp.oninput=function(){var v=+inp.value.replace(/[^0-9]/g,'');inp.value=v?fmt(v):'';clearTimeout(bt[b.id+inp.dataset.f]);bt[b.id+inp.dataset.f]=setTimeout(function(){var cur=state.budget[b.id]||b,o=Object.assign({},clean(cur));o[inp.dataset.f]=v;if(DB){state.budget[b.id]=o}put('budget',b.id,o)},650)};inp.onblur=function(){if(dirty){dirty=false;setTimeout(drawBudget,700)}}});
  if(canW){var x=el('button','xb',ico('trash'));x.setAttribute('aria-label','삭제');armDel(x,function(){del('budget',b.id)});r.appendChild(x)}else r.appendChild(el('span'));
  rows.appendChild(r)});
 var ba=$('badd');ba.innerHTML='';if(canW){var fb=el('button','fab',ico('plus')+'예산 항목 추가');fb.onclick=function(){ba.innerHTML='<div class="frm"><label>항목 이름</label><input id="bn" maxlength="40" placeholder="예: 기념품"><div class="g2"><div><label>예상 금액(원)</label><input id="be" inputmode="numeric"></div><div><label>메모</label><input id="bm" maxlength="60"></div></div></div><div class="btnrow"><button id="bc">취소</button><button class="p" id="bs">추가</button></div>';$('bc').onclick=drawBudget;$('bs').onclick=function(){var n=$('bn').value.trim();if(!n){$('bn').focus();return}var l=items('budget'),ord=l.length?l[l.length-1].ord+10:10;put('budget','u'+Date.now().toString(36),{n:n,note:$('bm').value.trim(),est:+($('be').value.replace(/[^0-9]/g,''))||0,act:0,ord:ord,ic:'won'});ba.innerHTML=''}};ba.appendChild(fb)}
 sumBudget()}
function sumBudget(){var E=0,A=0;items('budget').forEach(function(b){E+=+b.est||0;A+=+b.act||0});
 $('sE').textContent=fmt(E);$('sA').textContent=fmt(A);$('sP').textContent=fmt(Math.round(E/6));$('kE').textContent=Math.round(E/10000)+'만원';$('kA').textContent=Math.round(A/10000)+'만원';$('kP').textContent=Math.round(E/6/10000)+'만원';
 var r=E?Math.min(100,A/E*100):0;$('pbar').style.width=r+'%';$('pnote').textContent='예산 대비 '+r.toFixed(0)+'% 사용 · 남은 금액 '+fmt(Math.max(0,E-A))+'원'}
// ---- prep
function drawPrep(){var mv=$('moves');mv.innerHTML='';items('moves').forEach(function(m){var col=m.track==='sea'?'var(--acc)':m.track==='air'?'var(--warn)':'var(--ink)';var c=el('div','card tr mv','<b style="color:'+col+'">'+(m.track==='sea'?ico('ship'):m.track==='air'?ico('plane'):ico('pin'))+esc(m.title)+'</b>'+esc(m.body));c.style.margin='0';
  if(canW){var x=el('button','xb',ico('trash'));x.setAttribute('aria-label','삭제');armDel(x,function(){del('moves',m.id)});c.appendChild(x)}mv.appendChild(c)});
 var ma=$('madd');ma.innerHTML='';if(canW){var fb=el('button','fab',ico('plus')+'이동편 추가');fb.onclick=function(){ma.innerHTML='<div class="card frm"><label>구분</label><select id="mt"><option value="all">공통</option><option value="sea">배 · 아빠</option><option value="air">비행기 · 가족</option></select><label>제목</label><input id="mn" maxlength="40" placeholder="예: 렌터카"><label>내용 (줄바꿈 가능)</label><textarea id="mb" maxlength="500"></textarea><div class="btnrow"><button id="mc">취소</button><button class="p" id="ms">추가</button></div></div>';$('mc').onclick=drawPrep;$('ms').onclick=function(){var n=$('mn').value.trim();if(!n){$('mn').focus();return}var l=items('moves'),ord=l.length?l[l.length-1].ord+10:10;put('moves','u'+Date.now().toString(36),{title:n,body:$('mb').value.trim(),track:$('mt').value,ord:ord});ma.innerHTML=''}};ma.appendChild(fb)}
 var ck=$('ck');ck.innerHTML='';items('checks').forEach(function(c){var r=el('div','cl'+(c.done?' dn':''),'<input type="checkbox" id="k_'+c.id+'"'+(c.done?' checked':'')+(canW?'':' disabled')+'><label for="k_'+c.id+'">'+esc(c.text)+'</label>');
  r.querySelector('input').onchange=function(){var o=clean(state.checks[c.id]||c);o.done=this.checked?1:0;put('checks',c.id,o)};
  if(canW){var x=el('button','xb',ico('trash'));x.setAttribute('aria-label','삭제');armDel(x,function(){del('checks',c.id)});r.appendChild(x)}ck.appendChild(r)});
 $('ckadd').style.display=canW?'flex':'none'}
function addCheck(){var i=$('ckin'),t=i.value.trim();if(!t)return;var l=items('checks'),ord=l.length?l[l.length-1].ord+10:10;put('checks','u'+Date.now().toString(36),{text:t,done:0,ord:ord});i.value=''}
$('ckbtn').onclick=addCheck;$('ckin').addEventListener('keydown',function(e){if(e.key==='Enter')addCheck()});
// ---- init
function loadLocal(){var raw=lsGet('jp2-state');if(raw){try{var o=JSON.parse(raw);COLL.forEach(function(c){if(o[c])state[c]=o[c]})}catch(e){}}}
renderAll();loadWx();
(function init(){
 if(GAS_URL){mode='gas';canW=true;setStat('off','연결 중…');gasPoll();setInterval(gasPoll,4000);return}
 var timer=setTimeout(function(){if(mode==='boot'){mode='local';loadLocal();setStat('off','이 기기에만 저장');renderAll()}},10000);
 (HASC?claude.use('db'):Promise.resolve(null)).then(function(db){
  if(!db){clearTimeout(timer);mode='local';loadLocal();setStat('off','이 기기에만 저장 (공유는 로그인 필요)');renderAll();return}
  DB=db;mode='sync';
  var uP=(HASC?claude.use('user'):Promise.resolve(null)).then(function(u){return u&&u.can?u.can('data.write'):null}).catch(function(){return null});
  uP.then(function(w){canW=(w!==false);setStat('', canW?'실시간 동기화':'보기 전용');renderAll()});
  var started=false;
  function startSubs(){if(started)return;started=true;clearTimeout(timer);
   COLL.forEach(function(c){db.collection(c).onSnapshot(function(snap){var o={};snap.docs.forEach(function(d){o[d.id]=Object.assign({},d.data())});state[c]=o;if(!snap.metadata.fromCache)setStat('',canW?'실시간 동기화':'보기 전용');renderSoon()},function(e){setStat('err','동기화 오류')})})}
  db.doc('meta/seed').onSnapshot(function(snap){
   if(snap.exists){startSubs();return}
   if(started)return;
   if(canW===false){setStat('off','아직 공유된 데이터 없음');return}
   var seed=seedState(),jobs=[];COLL.forEach(function(c){Object.keys(seed[c]).forEach(function(id){jobs.push([c,id,seed[c][id]])})});
   setStat('off','초기 데이터 저장 중…');
   var p=Promise.resolve();jobs.forEach(function(j){p=p.then(function(){return db.collection(j[0]).doc(j[1]).set(j[2])})});
   p.then(function(){return db.doc('meta/seed').set({done:1})}).then(function(){startSubs()}).catch(onErr)
  },function(e){setStat('err','동기화 오류')})
 }).catch(function(){mode='local';loadLocal();setStat('off','이 기기에만 저장');renderAll()});
})();
</script></body></html>
